e{border:1px solid rgba(201,184,160,.5);color:#e8d5b7}.cta-solid{background:#fff;color:#0a0a0a}.features-heading{margin:36px 0 16px}.stats .stat{padding-top:20px}.feature-icon{flex:0 0 48px}.attention{scroll-margin-top:96px}.cic-wall-host{background:rgba(255,255,255,.025)!important;box-shadow:0 0 65px rgba(167,139,113,.12)!important;border:1px solid rgba(255,255,255,.1);border-radius:28px!important;overflow:hidden}.cic-wall-figure{color:#f5f2ee!important}.cic-wall-figure img{border-radius:14px!important}.cic-wall-empty{color:#d5d0c8!important}.cic-wall-empty a{color:#e8d5b7!important}.cic-gallery-filters button{background:rgba(255,255,255,.05)!important;color:#eee!important;border:1px solid rgba(255,255,255,.12)!important}.cic-gallery-filters button[aria-pressed=true]{background:#a78b71!important;color:#0a0a0a!important}.cic-staff-gallery a{color:#e8d5b7!important}.page-title{font-family:var(--serif);font-style:italic}.stagger-in{animation:reveal .85s cubic-bezier(.16,1,.3,1) both}@keyframes pulsing-branch{0%,100%{opacity:.4}50%{opacity:.7}}@keyframes line-flow{to{stroke-dashoffset:-40}}@keyframes breathe{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}@keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

<div class="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Coding in Color dashboard"><span class="logo" id="logo"></span><span id="appName"></span></a>
    <nav class="nav" id="nav" aria-label="Staff portal"></nav>
    <a class="student-link" href="/" target="_blank" rel="noopener">Student page ↗</a>
  </header>
  <main class="main" id="main"></main>
</div>
<footer class="site-footer"><span class="footer-brand">Coding in Color</span><q>Talent is everywhere, opportunity is not.</q><span><a href="/" target="_blank" rel="noopener">Student page</a> · <a href="https://github.com/CoolBro34/firebytes-hackathon" target="_blank" rel="noopener">GitHub repo</a></span></footer>
<div id="toast"></div>

<script>
/* ============================================================================
   CONFIG — EDIT THIS. Everything else is generic.
   Field types: text | textarea | number | money | date | select | checkbox | email | phone
   Field options: key, label, type, required, options[] (select), badge (select→colored pill),
                  hideInTable, placeholder, default, min
   Entity options: label, singular, icon, titleField, fields[], seed[], summary[], charts[], rowClass(rec), attentionReason(rec)
   ============================================================================ */
/*==CONFIG:START==*/
// PRESET: Coding in Color — Instagram posts -> family newsletter, plus anonymous retention tracking.
// Alumni updates are voluntary and consent-based; first name is optional and contact data is kept only with consent. All demo content is FAKE.
const d = n => { const t = new Date(); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); }; // date n days from today
// Organization copy is passed into AI drafts and shown in newsletter footers.
const ORG = { name: "Coding in Color", mission: "Coding in Color is on a mission to deliver educational resources for students who currently do not have access to computer science courses in their communities nor schools." };
// This list keeps session choices aligned with the nonprofit's current program names.
const PROGRAMS = ["AI Academy: Spark", "AI Academy: Amplify", "AI Academy: Reboot", "Hackathons", "Summer Camps"];
const pct = (a, b) => (Number(b) > 0 ? Math.round((Number(a) / Number(b)) * 100) : "");
const avg = xs => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);

// Pure selection and label formatting, also used by the dependency-free gallery tests.
function alumniWallItems(updates) {
  const rows = Array.isArray(updates) ? updates : [];
  const shared = rows.filter(row => row && row.consentShare === true);
  const newest = (a, b) => (Date.parse(b.submittedAt || "") || 0) - (Date.parse(a.submittedAt || "") || 0);
  const approved = shared.filter(row => row.status === "featured" || row.status === "reviewed").slice().sort(newest);
  const selected = approved.slice(0, 12);
  if (selected.length < 3) {
    const newUpdates = shared.filter(row => row.status === "new").slice().sort(newest);
    selected.push(...newUpdates.slice(0, 3 - selected.length));
  }
  return selected.map(row => {
    const firstName = String(row.firstName || "").trim().split(/\s+/)[0];
    const programs = Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || "");
    const firstProgram = programs.split(",")[0].trim();
    return {
      firstName,

// Staff gallery includes private stories; status chips are display-only metadata.
function staffGalleryItems(updates, filter = "all") {
  const rows = Array.isArray(updates) ? updates : [];
  return rows.filter(row => row && (filter === "hidden" ? row.status === "hidden" : row.status !== "hidden" && (filter === "all" || row.status === filter)))
    .slice().sort((a, b) => (Date.parse(b.submittedAt || "") || 0) - (Date.parse(a.submittedAt || "") || 0))
    .map(row => {
      const item = alumniWallItems([row])[0] || {
        firstName: String(row.firstName || "").trim().split(/\s+/)[0], nowDoing: String(row.nowDoing || ""),
        field: String(row.field || ""), school: String(row.school || ""), story: String(row.story || ""),
        programs: Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || ""), submittedAt: String(row.submittedAt || ""),
        label: `${String(row.firstName || "").trim().split(/\s+/)[0] || "Alum"} · ${(Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || "")).split(",")[0].trim() || "Program"}`

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = [];
  let line = "";
  words.forEach(word => {
    const next = line ? line + " " + word : word;
    if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
    else line = next;
  });
  if (line) lines.push(line);
  lines.slice(0, maxLines).forEach((value, index) => {
    if (index === maxLines - 1 && lines.length > maxLines) value = value.slice(0, Math.max(0, value.length - 1)) + "…";
    ctx.fillText(value, x, y + index * lineHeight, maxWidth);
  });
}
function excerpt(text, limit = 110) {
  const value = String(text || "").replace(/\s+/g, " ").trim();
  return value.length > limit ? value.slice(0, limit - 1).trimEnd() + "…" : value;
}

function wireDashboardNeuralLines() {
  const stage = document.querySelector("#neuralStage"), core = document.querySelector("#neuralCore"), svg = document.querySelector("#neuralLines");
  if (!stage || !core || !svg) return;
  const update = () => {
    const bounds = stage.getBoundingClientRect(), center = core.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${Math.round(bounds.width)} ${Math.round(bounds.height)}`);
    const cx = center.left + center.width / 2 - bounds.left, cy = center.top + center.height / 2 - bounds.top;
    stage.querySelectorAll(".neural-satellite").forEach(card => {
      const label = card.getAttribute("aria-label") || "", target = label.startsWith("Alumni") ? "alumni" : label.startsWith("Newsletter") ? "newsletter" : label.startsWith("Sessions") ? "sessions" : label.startsWith("Needs") ? "attention" : "student";
      const box = card.getBoundingClientRect(), x = box.left + box.width / 2 - bounds.left, y = box.top + box.height / 2 - bounds.top;
      const dx = x - cx, dy = y - cy, bend = Math.max(36, Math.min(110, Math.abs(dx) * .24));
      const d = `M ${cx} ${cy} C ${cx + (dx < 0 ? -bend : bend)} ${cy + dy * .12}, ${x - (dx < 0 ? -bend : bend)} ${y - dy * .12}, ${x} ${y}`;
      stage.querySelectorAll(`.node-line[data-node="${target}"]`).forEach(path => path.setAttribute("d", d));
    });
  };
  let frame = 0;
  const schedule = () => { if (frame) cancelAnimationFrame(frame); frame = requestAnimationFrame(() => { frame = 0; update(); }); };
  const spaceToActivate = event => { if (event.key === " ") { event.preventDefault(); event.currentTarget.click(); } };
  const satellites = [...stage.querySelectorAll(".neural-satellite")];
  satellites.forEach(card => card.addEventListener("keydown", spaceToActivate));
  const observer = typeof ResizeObserver === "undefined" ? null : new ResizeObserver(schedule);
  if (observer) observer.observe(stage);
  window.addEventListener("resize", schedule);
  const onVisibility = () => stage.classList.toggle("is-paused", document.hidden);
  document.addEventListener("visibilitychange", onVisibility); onVisibility(); update();
  return () => { if (frame) cancelAnimationFrame(frame); observer && observer.disconnect(); satellites.forEach(card => card.removeEventListener("keydown", spaceToActivate)); window.removeEventListener("resize", schedule); document.removeEventListener("visibilitychange", onVisibility); };
}

/* ---------- Newsletter helpers: format and prepare drafts in the browser; AI calls remain in the Worker. ---------- */
const NL = {
  async postJSON(path, body) {
    const r = await apiFetch(CONFIG.apiBase + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Request failed (" + r.status + ")");
    return j;
  },
  async caps() { try { const r = await apiFetch(CONFIG.apiBase + "/api/capabilities"); return r.ok ? await r.json() : {}; } catch (e) { return {}; } },
  bytesToB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); },
  // Shrink an image to max 1024px JPEG so it uploads fast
  async imageToB64(file) {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85).split(",")[1];
  },
  // Pull the audio out of a reel/video, keep the first 2 minutes, convert to 16 kHz mono WAV for speech-to-text
  async videoToWavB64(file) {
    const buf = await file.arrayBuffer(), ctx = new AudioContext();
    const audio = await ctx.decodeAudioData(buf); ctx.close();
    const secs = Math.min(audio.duration, 120), rate = 16000;
    const off = new OfflineAudioContext(1, Math.ceil(secs * rate), rate), src = off.createBufferSource();
    src.buffer = audio; src.connect(off.destination); src.start(0, 0, secs);
    const pcm = (await off.startRendering()).getChannelData(0);
    const out = new DataView(new ArrayBuffer(44 + pcm.length * 2)), w = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
    w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, pcm.length * 2, true);
    for (let i = 0; i < pcm.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
    return NL.bytesToB64(new Uint8Array(out.buffer));
  },
  // No-AI fallback: a simple newsletter straight from the post captions
  simple(posts, period, alumni = []) {
    const hasSpotlight = alumni.length > 0;
    const sections = posts.slice(0, hasSpotlight ? 4 : 5).map(p => ({ heading: p.title || "Update", body: (p.caption || p.imageNotes || "").slice(0, 500), link: p.link || "" }));
    if (hasSpotlight) {
      const lines = alumni.slice(0, 2).map(a => {
        const story = String(a.story || "").slice(0, 400).trim();
        const sentence = (story.match(/^[\s\S]*?[.!?](?:\s|$)/) || [story])[0].trim();
        return `${a.firstName || "A former student"}: ${sentence && /[.!?]$/.test(sentence) ? sentence : sentence + "."}`;
      });
      sections.push({ heading: "Alumni spotlight", body: lines.join(" "), link: alumni.find(a => a.link)?.link || "" });
    }
    return {
      subject: `What's new at ${ORG.name}: ${period}`.slice(0, 60),
      preheader: `${posts.length} update${posts.length === 1 ? "" : "s"} from our Instagram, in one place`,
      intro: `Here's everything we shared on Instagram for ${period}, in one quick read. Thanks for being part of our community!`,
      sections,
      cta: "We'd love to see you at the next session. Bring a friend!"
    };
  },
  // Email-safe HTML (inline styles) for pasting into Gmail / Mailchimp / any email tool
  emailHTML(n, lang = "en") {
    const e = s => esc(s), P = "#0A8F27", es = lang === "es";
    return `<div style="max-width:600px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;color:#1f2937;line-height:1.5">
<div style="display:none;max-height:0;overflow:hidden">${e(n.preheader)}</div>
<div style="background:${P};color:#fff;padding:22px 24px;border-radius:12px 12px 0 0"><div style="font-size:13px;opacity:.85">${e(ORG.name)}</div><div style="font-size:22px;font-weight:bold">${e(n.subject)}</div></div>
<div style="background:#fff;border:1px solid #e5e7eb;border-top:none;padding:22px 24px;border-radius:0 0 12px 12px">
<p style="font-size:16px;margin:0 0 18px">${e(n.intro)}</p>
${n.sections.map(s => `<h2 style="font-size:18px;color:${P};margin:22px 0 6px">${e(s.heading)}</h2><p style="margin:0 0 8px;font-size:15px">${e(s.body)}</p>${s.link ? `<a href="${e(s.link)}" style="color:${P};font-weight:bold;font-size:14px">${es ? "Ver la publicación" : "See the post"} &rarr;</a>` : ""}`).join("\n")}
<div style="margin-top:26px;padding:16px;background:#F3F3F3;border-radius:0;font-size:16px;font-weight:bold;color:#0A8F27">${e(n.cta)}</div>
<p style="margin-top:24px;font-size:12px;color:#6b7280">${e(ORG.mission)}${es ? '<br>"El talento está en todas partes, la oportunidad no."' : ""}<br>${es ? "Recibe este correo porque su familia forma parte de Coding in Color." : "You're getting this because your family is part of " + e(ORG.name) + "."}</p>
</div></div>`;
  },
  plainText(n, lang = "en") { const es = lang === "es"; return [n.subject, "", n.intro, "", ...n.sections.flatMap(s => [s.heading.toUpperCase(), s.body, s.link ? (es ? "Ver la publicación: " : "See the post: ") + s.link : "", ""]), n.cta, "", ORG.mission, ...(es ? ["El talento está en todas partes, la oportunidad no."] : [])].join("\n"); },
  download(name, text) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/html" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const uid = () => "r_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = {
  money: v => (v === "" || v == null || isNaN(v)) ? "" : CONFIG.currency + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  number: v => (v === "" || v == null || isNaN(v)) ? "" : Number(v).toLocaleString(),
  date: v => { if (!v) return ""; const t = new Date(v + "T00:00:00"); return isNaN(t) ? v : t.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
};

function toast(msg, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toast").appendChild(t); setTimeout(() => t.remove(), 2600);
}

let staffCodePrompt = null;
function askStaffPasscode(message = "") {
  if (staffCodePrompt) return staffCodePrompt;
  staffCodePrompt = new Promise(resolve => {
    const overlay = document.createElement("div"); overlay.className = "pass-overlay";
    overlay.innerHTML = `<section class="pass-card" role="dialog" aria-modal="true" aria-labelledby="passTitle"><h2 id="passTitle">Staff portal</h2><p>Enter your staff passcode to continue.</p><form><label for="staffPass">Staff passcode</label><input id="staffPass" type="password" autocomplete="current-password" required><p class="count" aria-live="polite">${esc(message || "Ask your program lead for the staff passcode")}</p><button class="btn primary" type="submit">Unlock</button></form></section>`;
    document.body.appendChild(overlay);
    const input = $("#staffPass", overlay); input.focus();
    $("form", overlay).onsubmit = event => { event.preventDefault(); const value = input.value; overlay.remove(); staffCodePrompt = null; resolve(value); };
  });
  return staffCodePrompt;
}

async function apiFetch(url, options = {}) {
  const headers = new Headers(options.headers || {});
  let code = ""; try { code = localStorage.getItem("cic_staff_code") || ""; } catch (e) { }
  if (code) headers.set("x-staff-code", code);
  let response = await fetch(url, { ...options, headers });
  while (response.status === 401) {
    code = await askStaffPasscode(code ? "That passcode was not accepted. Try again, or ask your program lead." : "Ask your program lead for the staff passcode");
    try { localStorage.setItem("cic_staff_code", code); } catch (e) { }
    headers.set("x-staff-code", code);
    response = await fetch(url, { ...options, headers });
  }
  return response;
}

/* ---------- Storage adapter: REST backend if available, else localStorage ---------- */
const Store = {
  mode: "local", ai: false,
  key: e => `sbs:${slug(CONFIG.appName)}:${e}`,
  async init() {
    try {                                                   // optional AI helper (Cloudflare Worker with ANTHROPIC_API_KEY secret)
      const r = await apiFetch(CONFIG.apiBase + "/api/capabilities"); if (r.ok) this.ai = !!(await r.json()).ai;
    } catch (e) { }
    if (CONFIG.storage === "local") return;
    try {
      const c = new AbortController(); const t = setTimeout(() => c.abort(), 800);
      const r = await apiFetch(CONFIG.apiBase + "/api/ping", { signal: c.signal }); clearTimeout(t);
      if (r.ok) this.mode = "api";
    } catch (e) { if (CONFIG.storage === "api") toast("Backend not reachable — using local storage", true); }
  },
  _local(e) {
    const raw = localStorage.getItem(this.key(e));
    if (raw === null) { const seeded = (CONFIG.entities[e].seed || []).map(r => ({ id: uid(), ...r })); this._save(e, seeded); return seeded; }
    try { return JSON.parse(raw); } catch (x) { return []; }
  },
  _save(e, arr) { localStorage.setItem(this.key(e), JSON.stringify(arr)); },
  async _api(method, path, body) {
    const r = await apiFetch(CONFIG.apiBase + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")"));
    return j;
  },
  async list(e) {
    if (this.mode === "api") return this._api("GET", `/api/${e}`);
    return this._local(e);
  },
  async create(e, rec) {
    if (this.mode === "api") return this._api("POST", `/api/${e}`, rec);
    const all = this._local(e), r = { id: uid(), ...rec }; all.push(r); this._save(e, all); return r;
  },
  async update(e, id, rec) {
    if (this.mode === "api") return this._api("PUT", `/api/${e}/${id}`, rec);
    const all = this._local(e), i = all.findIndex(x => x.id === id);
    if (i < 0) throw new Error("Record not found"); all[i] = { ...all[i], ...rec, id }; this._save(e, all); return all[i];
  },
  async remove(e, id) {
    if (this.mode === "api") return this._api("DELETE", `/api/${e}/${id}`);
    this._save(e, this._local(e).filter(x => x.id !== id)); return { ok: true };
  },
  async replaceAll(data) {          // data = { entity: [records...] } ; used by reset/import
    const names = Object.keys(CONFIG.entities);
    if (this.mode === "api") { const body = {}; names.forEach(n => body[n] = data[n] || []); return this._api("POST", "/api/_reset", body); }
    names.forEach(n => this._save(n, (data[n] || []).map(r => ({ id: r.id || uid(), ...r }))));
  },
  async exportAll() { const out = {}; for (const n of Object.keys(CONFIG.entities)) out[n] = await this.list(n); return out; },
  seedData() { const out = {}; Object.keys(CONFIG.entities).forEach(n => out[n] = (CONFIG.entities[n].seed || []).map(r => ({ id: uid(), ...r }))); return out; }
};
const api = { list: e => Store.list(e), create: (e, r) => Store.create(e, r), update: (e, i, r) => Store.update(e, i, r), remove: (e, i) => Store.remove(e, i), openForm: (e, r, done) => openForm(e, r, done), toast, esc, fmt };

  if (v === undefined || v === null || v === "") return "";
  if (f.type === "computed") return esc(f.format === "money" ? fmt.money(v) : f.format === "number" ? fmt.number(v) : f.format === "date" ? fmt.date(v) : v);
  if (f.type === "money") return esc(fmt.money(v));

  if (f.type === "select" && f.badge) return `<span class="badge" style="background:${badgeColor(f, v)}">${esc(v)}</span>`;

}

/* ---------- Modal ---------- */
function modal(html, onMount) {
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown", e => { if (e.target === ov) close(); });
  document.body.appendChild(ov); onMount && onMount(ov, close); return close;
}
function confirmBox(msg, yesLabel = "Delete") {
  return new Promise(res => {
    modal(`<h2>Are you sure?</h2><p>${esc(msg)}</p><div class="row"><button class="btn" data-no>Cancel</button><button class="btn danger" data-yes>${esc(yesLabel)}</button></div>`,
      (ov, close) => { $("[data-no]", ov).onclick = () => { close(); res(false); }; $("[data-yes]", ov).onclick = () => { close(); res(true); }; });
  });
}

    }
  };
  const html = `<h2>${editing ? "Edit" : "Add"} ${esc(ent.singular)}</h2><form novalidate>
    ${editable(ent).map(f => `<div class="field"><label for="f_${f.key}">${esc(f.label)}${f.required ? " *" : ""}</label>${inputFor(f)}<div class="err" id="e_${f.key}"></div></div>`).join("")}
    <div class="row"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary" type="submit">${editing ? "Save changes" : "Add"}</button></div></form>`;
  modal(html, (ov, close) => {

    $("[data-cancel]", ov).onclick = close;
    $("form", ov).onsubmit = async ev => {
      ev.preventDefault();
      const out = {}; let ok = true;

        const err = $("#e_" + f.key, ov); err.textContent = "";

        if ((f.type === "number" || f.type === "money") && v !== "") {
          v = Number(v); if (isNaN(v)) { err.textContent = "Enter a number"; ok = false; continue; }
          if (f.min != null && v < f.min) { err.textContent = "Must be at least " + f.min; ok = false; continue; }
        }

        out[f.key] = v;
      }

      try {
        if (editing) await Store.update(entName, rec.id, out); else await Store.create(entName, out);
        close(); toast(editing ? "Saved" : "Added"); done && done();
      } catch (e) { toast(e.message, true); }

  });
}

/* ---------- CSV ---------- */
function toCSV(ent, rows) {
  const q = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [ent.fields.map(f => q(f.label)).join(",")].concat(rows.map(r => ent.fields.map(f => q(plainValue(f, val(f, r)))).join(","))).join("\r\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function download(name, text, mime = "text/csv") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function pickFile(accept) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.onchange = () => { const f = i.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(f); }; i.click(); });
}
async function importCSV(entName, done) {
  const ent = CONFIG.entities[entName]; const text = await pickFile(".csv,text/csv"); if (text == null) return;
  const rows = parseCSV(text); if (rows.length < 2) return toast("That CSV has no data rows", true);
  const head = rows[0].map(h => h.trim().toLowerCase());
  const idx = editable(ent).map(f => { let i = head.indexOf(f.label.toLowerCase()); if (i < 0) i = head.indexOf(f.key.toLowerCase()); return i; });
  if (idx.every(i => i < 0)) return toast("No matching column headers found", true);
  let added = 0, skipped = 0;
  for (const r of rows.slice(1)) {
    const rec = {}; let valid = true;
    editable(ent).forEach((f, k) => {
      let v = idx[k] >= 0 ? (r[idx[k]] ?? "").trim() : (f.default ?? "");
      if ((f.type === "number" || f.type === "money") && v !== "") { v = Number(String(v).replace(/[$,]/g, "")); if (isNaN(v)) valid = false; }
      if (f.type === "checkbox") v = /^(true|yes|1|✓)$/i.test(String(v));
      if (f.required && (v === "" || v == null)) valid = false;
      rec[f.key] = v;
    });
    if (!valid) { skipped++; continue; }
    try { await Store.create(entName, rec); added++; } catch (e) { skipped++; }
  }
  toast(`Imported ${added} row${added === 1 ? "" : "s"}` + (skipped ? `, skipped ${skipped}` : ""), skipped && !added); done && done();
}

/* ---------- Charts (plain canvas) ---------- */
function groupData(ent, rows, c) {
  const gf = fieldOf(ent, c.groupBy), vf = c.value ? fieldOf(ent, c.value) : null;
  const gv = r => gf ? val(gf, r) : r[c.groupBy], vv = r => vf ? val(vf, r) : r[c.value];
  const m = new Map();
  rows.forEach(r => {
    const g = gv(r), groups = c.splitComma ? String(g || "").split(",").map(x => x.trim()).filter(Boolean) : [g];
    groups.forEach(value => { const k = value === "" || value == null ? "(none)" : String(value); m.set(k, (m.get(k) || 0) + (c.value ? Number(vv(r)) || 0 : 1)); });
  });
  let entries = [...m.entries()];
  if (c.type === "line") entries.sort((a, b) => a[0].localeCompare(b[0]));
  return entries;
}
function drawChart(cv, entries, c) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const pal = palette(), text = cssVar("--text"), muted = cssVar("--muted"), border = cssVar("--border");
  const vf = v => c.format === "money" ? fmt.money(v) : fmt.number(Math.round(v * 100) / 100);
  g.font = "12px " + cssVar("--font");
  if (!entries.length) { g.fillStyle = muted; g.textAlign = "center"; g.fillText("No data yet", W / 2, H / 2); return; }
  if (c.type === "doughnut") {
    const total = entries.reduce((a, e) => a + e[1], 0) || 1, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 8; let a0 = -Math.PI / 2;
    entries.forEach((e, i) => { const a1 = a0 + e[1] / total * Math.PI * 2; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a1); g.closePath(); g.fillStyle = pal[i % 6]; g.fill(); a0 = a1; });
    g.globalCompositeOperation = "destination-out"; g.beginPath(); g.arc(cx, cy, R * 0.58, 0, Math.PI * 2); g.fill(); g.globalCompositeOperation = "source-over";
    g.fillStyle = text; g.textAlign = "center"; g.font = "700 22px " + cssVar("--font"); g.fillText(vf(total), cx, cy + 6);
    return;
  }
  const L = 62, Rr = 10, T = 14, B = 34, pw = W - L - Rr, ph = H - T - B, max = Math.max(...entries.map(e => e[1]), 1) * 1.1;
  g.strokeStyle = border; g.fillStyle = muted; g.textAlign = "right";
  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(W - Rr, y); g.stroke(); g.fillText(vf(max * i / 4), L - 6, y + 4); }
  const step = pw / entries.length; g.textAlign = "center";
  const maxc = Math.max(4, Math.floor(step / 7)), label = s => s.length > maxc ? s.slice(0, maxc - 1) + "…" : s;
  if (c.type === "line") {
    g.strokeStyle = pal[0]; g.lineWidth = 2.5; g.beginPath();
    entries.forEach((e, i) => { const x = L + step * (i + .5), y = T + ph - ph * e[1] / max; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    entries.forEach((e, i) => { const x = L + step * (i + .5), y = T + ph - ph * e[1] / max; g.fillStyle = pal[0]; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.fillStyle = muted; g.fillText(label(e[0]), x, H - 14); });
  } else {
    entries.forEach((e, i) => {
      const bw = Math.min(54, step * .62), x = L + step * (i + .5) - bw / 2, h = ph * e[1] / max, y = T + ph - h;
      g.fillStyle = pal[i % 6]; g.beginPath(); (g.roundRect ? g.roundRect(x, y, bw, h, 6) : g.rect(x, y, bw, h)); g.fill();
      g.fillStyle = text; g.fillText(vf(e[1]), x + bw / 2, y - 5); g.fillStyle = muted; g.fillText(label(e[0]), x + bw / 2, H - 14);
    });
  }
}

/* ---------- Summary cards ---------- */
function computeStat(s, rows) {
  const whereOK = r => !s.where || Object.entries(s.where).every(([k, vals]) => [].concat(vals).includes(r[k]));
  const f = rows.filter(whereOK); const nums = () => f.map(r => Number(r[s.field])).filter(n => !isNaN(n));
  switch (s.fn) {
    case "count": return f.length;
    case "countIf": return rows.filter(s.test).length;
    case "sum": return nums().reduce((a, b) => a + b, 0);
    case "avg": { const n = nums(); return n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0; }
    case "max": return Math.max(0, ...nums());
    case "custom": return s.compute(rows);       // compute: rows => number
    default: return 0;
  }
}

function attentionHTML(data) {
  const bad = [], warn = [];
  for (const [name, ent] of Object.entries(CONFIG.entities)) {
    if (typeof ent.rowClass !== "function") continue;
    for (const rec of data[name] || []) {
      let kind = "";
      try { kind = ent.rowClass(rec); } catch (_) { continue; }
      if (kind === "flag-bad") bad.push({ name, ent, rec, kind: "bad" });
      else if (kind === "flag-warn") warn.push({ name, ent, rec, kind: "warn" });
    }
  }
  const items = bad.concat(warn), total = items.length;
  if (!total) return "";
  const rows = items.slice(0, 8).map(({ name, ent, rec, kind }) => {
    const title = rec[ent.titleField] || ent.titleFallback || "(untitled)";
    let reason = "";
    if (typeof ent.attentionReason === "function") {
      try { const value = ent.attentionReason(rec); if (typeof value === "string" && value) reason = `<span class="att-why">${esc(value)}</span>`; } catch (_) {}
    }
    return `<li class="att-${kind}"><a href="#/${esc(name)}">${esc(ent.icon || "")} <b>${esc(title)}</b> <span class="att-ent">${esc(ent.singular || "")}</span></a>${reason}</li>`;
  }).join("");
  const more = total > 8 ? `<div class="att-more">+${total - 8} more</div>` : "";
  return `<div class="card attention"><h3>Needs attention <span class="att-count">${esc(total)}</span></h3><ul class="att-list">${rows}</ul>${more}</div>`;
}

async function route() {
  if (location.hash === "#attention") { const target = document.querySelector("#attention"); if (target) target.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (window._cleanup) { try { window._cleanup(); } catch (e) {} window._cleanup = null; }
  const id = (location.hash.replace(/^#\//, "") || "dashboard");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  window._redraw = null;
  try {
    if (id === "dashboard") await viewDashboard();
    else if (id === "settings") await viewSettings();
    else if (id.startsWith("x/")) { const v = CONFIG.extraViews.find(v => "x/" + v.id === id); main.innerHTML = ""; v ? await v.render(main, api) : (main.innerHTML = "<p>Not found</p>"); }
    else if (CONFIG.entities[id]) await viewEntity(id);
    else main.innerHTML = '<div class="empty">Page not found</div>';
  } catch (e) { main.innerHTML = `<div class="card"><b>Something went wrong.</b><br>${esc(e.message)}</div>`; console.error(e); }
}

/* ===================== BOOT (initialize storage, seed demo rows, then route) ===================== */
(async function boot() {
  // Header slots are optional in a layout (the redesigned top bar has no tagline slot), so fill only the ones that exist.
  const setText = (sel, text) => { const el = $(sel); if (el) el.textContent = text; };
  setText("#appName", CONFIG.appName); setText("#tagline", CONFIG.tagline); setText("#logo", CONFIG.logo || "");
  document.title = CONFIG.appName;
  let t = CONFIG.theme; try { t = localStorage.getItem("sbs:theme") || t; } catch (e) { }
  applyTheme(THEMES.includes(t) ? t : "ocean");
  await Store.init();
  if (Store.mode === "api") {                 // first run against an empty database → load demo data once
    const flag = "sbs:" + slug(CONFIG.appName) + ":seeded";
    let done = false; try { done = localStorage.getItem(flag) === "1"; } catch (e) { }
    if (!done) {
      const lists = await Promise.all(Object.keys(CONFIG.entities).map(n => Store.list(n)));
      if (lists.every(a => a.length === 0)) await Store.replaceAll(Store.seedData());
      try { localStorage.setItem(flag, "1"); } catch (e) { }
    }
  }
  buildNav(); window.addEventListener("hashchange", route);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => window._redraw && window._redraw(), 150); });
  route();
})();
</script>
