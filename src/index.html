<!DOCTYPE html>
<html lang="en" data-theme="ocean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding in Color</title>
<!--
  ╔══════════════════════════════════════════════════════════════════════════╗
  ║  CONFIG-DRIVEN STARTER — generic engine plus a replaceable app preset     ║
  ║                                                                          ║
  ║  HOW TO ADAPT IT (all in the CONFIG block below):                        ║
  ║   1. Change appName / tagline / theme                                    ║
  ║   2. Define your entities + fields  → tables, forms, CSV, charts appear  ║
  ║   3. Add `summary` cards and `charts` per entity for the dashboard       ║
  ║   4. Need a custom screen?  add it to CONFIG.extraViews                  ║
  ║                                                                          ║
  ║  STORAGE: 'auto' = use the Python/REST backend if /api/ping answers,     ║
  ║  otherwise fall back to this browser's localStorage. Same UI either way. ║
  ╚══════════════════════════════════════════════════════════════════════════╝
-->
<style>
/* ===================== THEMES (change colors here or add a new block) ===================== */
:root{
  --radius:12px; --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
[data-theme="ocean"]{--bg:#f3f6fb;--surface:#ffffff;--text:#16212f;--muted:#6a7787;--border:#e2e8f0;--primary:#2563eb;--primary-text:#fff;--side:#0f1d33;--side-text:#c9d6ea;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;
  --c1:#2563eb;--c2:#0ea5e9;--c3:#14b8a6;--c4:#8b5cf6;--c5:#f59e0b;--c6:#ef4444}
[data-theme="forest"]{--bg:#f4f7f2;--surface:#ffffff;--text:#1b2a1f;--muted:#69776b;--border:#dfe7dc;--primary:#2f7d4f;--primary-text:#fff;--side:#173324;--side-text:#cfe3d5;--danger:#c0392b;--ok:#2f7d4f;--warn:#b7791f;
  --c1:#2f7d4f;--c2:#7cb342;--c3:#26a69a;--c4:#8d6e63;--c5:#f9a825;--c6:#d84315}
[data-theme="sunset"]{--bg:#fff7f2;--surface:#ffffff;--text:#2b1a14;--muted:#8a6f63;--border:#f1ddd2;--primary:#e8590c;--primary-text:#fff;--side:#3b1d12;--side-text:#f3d9cb;--danger:#c92a2a;--ok:#2b8a3e;--warn:#e67700;
  --c1:#e8590c;--c2:#f59f00;--c3:#d6336c;--c4:#7048e8;--c5:#1098ad;--c6:#5c940d}
[data-theme="midnight"]{--bg:#0e131b;--surface:#161d29;--text:#e6ecf5;--muted:#8d9bb0;--border:#263143;--primary:#6ea8ff;--primary-text:#0b1220;--side:#0a0f16;--side-text:#9fb0c8;--danger:#ff6b6b;--ok:#4ade80;--warn:#fbbf24;
  --c1:#6ea8ff;--c2:#4dd4ac;--c3:#c792ea;--c4:#ffcb6b;--c5:#ff8b7b;--c6:#82aaff}
[data-theme="mono"]{--bg:#f6f6f6;--surface:#ffffff;--text:#111;--muted:#777;--border:#e3e3e3;--primary:#111;--primary-text:#fff;--side:#111;--side-text:#ccc;--danger:#b00020;--ok:#1b7f3b;--warn:#a15c00;
  --c1:#111;--c2:#555;--c3:#888;--c4:#aaa;--c5:#c9a227;--c6:#b00020}

/* ===================== LAYOUT ===================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-text);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:4px 8px 2px}
.brand .logo{font-size:24px}
.tagline{font-size:12px;color:var(--side-text);opacity:.8;padding:0 8px 14px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--side-text);text-decoration:none;padding:9px 10px;border-radius:10px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.active{background:var(--primary);color:var(--primary-text)}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:8px 4px}
.main{padding:26px 30px 60px;max-width:1200px;width:100%}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:28px;font-weight:700;margin-top:2px}
.stat .hint{font-size:12px;color:var(--muted)}
.charts{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card h3{margin:0 0 10px;font-size:15px}
canvas{width:100%;height:220px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ===================== TOOLBAR / TABLE ===================== */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);border-color:var(--primary)}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px;font-weight:600}
.tablewrap{overflow:auto;padding:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;user-select:none;background:var(--surface);position:sticky;top:0}
th.noclick{cursor:default}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--primary) 5%,transparent)}
tr.flag-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.flag-bad td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
tr.flag-good td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.attention{margin-bottom:14px}
.att-count{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px}
.att-list{list-style:none;padding:0;margin:0}
.att-list li{padding:7px 10px;border-left:4px solid var(--border)}
.att-list li.att-bad{border-color:var(--danger)}
.att-list li.att-warn{border-color:var(--warn)}
.att-list a{color:inherit;text-decoration:none}
.att-list a:hover{text-decoration:underline}
.att-ent,.att-why,.att-more{font-size:12px;color:var(--muted)}
.att-ent{margin-left:6px}
.att-why{margin-left:8px}
.att-more{margin-top:8px}
td.num,th.num{text-align:right}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.empty{padding:40px;text-align:center;color:var(--muted)}
.count{color:var(--muted);font-size:13px}

/* ===================== MODAL / TOAST ===================== */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 14px;font-size:20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field .err{color:var(--danger);font-size:12px;min-height:0}
.field input[type=checkbox]{width:20px;height:20px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.toast{background:#111;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px}
.toast.bad{background:var(--danger)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.pass-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,15,25,.62);display:grid;place-items:center;padding:16px}
.pass-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pass-card label{display:block;font-weight:650;margin-bottom:6px}
.pass-card input{width:100%;min-height:48px}
.pass-card .btn{min-height:46px;margin-top:12px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .tagline{display:none}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .main{padding:18px 14px 50px}
}
@media print{
  .side,.toolbar,.noprint,#toast{display:none!important}
  .app{display:block} body{background:#fff}
  .card{box-shadow:none;border:none} .main{padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" id="logo"></span><span id="appName"></span></div>
    <div class="tagline" id="tagline"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

<script>
/* ============================================================================
   CONFIG — EDIT THIS. Everything else is generic.
   Field types: text | textarea | number | money | date | select | checkbox | email | phone
   Field options: key, label, type, required, options[] (select), badge (select→colored pill),
                  hideInTable, placeholder, default, min
   Entity options: label, singular, icon, titleField, fields[], seed[], summary[], charts[], rowClass(rec), attentionReason(rec)
   ============================================================================ */
/*==CONFIG:START==*/
// PRESET: Coding in Color — Instagram posts -> family newsletter, plus anonymous retention tracking.
// Alumni updates are voluntary and consent-based; first name is optional and contact data is kept only with consent. All demo content is FAKE.
const d = n => { const t = new Date(); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); }; // date n days from today
// Organization copy is passed into AI drafts and shown in newsletter footers.
const ORG = { name: "Coding in Color", mission: "Coding in Color is on a mission to deliver educational resources for students who currently do not have access to computer science courses in their communities nor schools." };
// This list keeps session choices aligned with the nonprofit's current program names.
const PROGRAMS = ["AI Academy: Spark", "AI Academy: Amplify", "AI Academy: Reboot", "Hackathons", "Summer Camps"];
const pct = (a, b) => (Number(b) > 0 ? Math.round((Number(a) / Number(b)) * 100) : "");
const avg = xs => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);

// Pure selection and label formatting, also used by the dependency-free gallery tests.
function alumniWallItems(updates) {
  const rows = Array.isArray(updates) ? updates : [];
  const shared = rows.filter(row => row && row.consentShare === true);
  const newest = (a, b) => (Date.parse(b.submittedAt || "") || 0) - (Date.parse(a.submittedAt || "") || 0);
  const approved = shared.filter(row => row.status === "featured" || row.status === "reviewed").slice().sort(newest);
  const selected = approved.slice(0, 12);
  if (selected.length < 3) {
    const newUpdates = shared.filter(row => row.status === "new").slice().sort(newest);
    selected.push(...newUpdates.slice(0, 3 - selected.length));
  }
  return selected.map(row => {
    const firstName = String(row.firstName || "").trim().split(/\s+/)[0];
    const programs = Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || "");
    const firstProgram = programs.split(",")[0].trim();
    return {
      firstName,
      nowDoing: String(row.nowDoing || ""),
      field: String(row.field || ""),
      school: String(row.school || ""),
      story: String(row.story || ""),
      programs,
      submittedAt: String(row.submittedAt || ""),
      label: `${firstName || "Alum"} · ${firstProgram || "Program"}`
    };
  });
}

// Staff gallery includes private stories; status chips are display-only metadata.
function staffGalleryItems(updates, filter = "all") {
  const rows = Array.isArray(updates) ? updates : [];
  return rows.filter(row => row && (filter === "hidden" ? row.status === "hidden" : row.status !== "hidden" && (filter === "all" || row.status === filter)))
    .slice().sort((a, b) => (Date.parse(b.submittedAt || "") || 0) - (Date.parse(a.submittedAt || "") || 0))
    .map(row => {
      const item = alumniWallItems([row])[0] || {
        firstName: String(row.firstName || "").trim().split(/\s+/)[0], nowDoing: String(row.nowDoing || ""),
        field: String(row.field || ""), school: String(row.school || ""), story: String(row.story || ""),
        programs: Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || ""), submittedAt: String(row.submittedAt || ""),
        label: `${String(row.firstName || "").trim().split(/\s+/)[0] || "Alum"} · ${(Array.isArray(row.programs) ? row.programs.join(", ") : String(row.programs || "")).split(",")[0].trim() || "Program"}`
      };
      item.id = row.id; item.status = row.status; item.private = row.consentShare !== true;
      item.tag = row.status === "new" ? "NEW" : row.status === "featured" ? "FEATURED" : "REVIEWED";
      item.record = row;
      return item;
    });
}

// Lazy OGL gallery. All card art is drawn from consented text in memory; no photo is uploaded or saved.
const GALLERY = {
  create(container, options) {
    let destroyed = false, renderer = null, raf = 0, observer = null, activeCanvas = null, currentCards = [], moveBy = () => {}, centeredIndex = () => 0;
    const listeners = [];
    const add = (target, type, fn, config) => {
      target.addEventListener(type, fn, config);
      listeners.push([target, type, fn, config]);
    };
    const stopWebGL = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      if (observer) observer.disconnect();
      observer = null;
      while (listeners.length) {
        const [target, type, fn, config] = listeners.pop();
        target.removeEventListener(type, fn, config);
      }
      if (renderer) {
        try { renderer.gl.getExtension("WEBGL_lose_context")?.loseContext(); } catch (e) { }
        renderer = null;
      }
      if (activeCanvas) activeCanvas.remove();
      activeCanvas = null;
    };
    const destroy = () => {
      if (destroyed) return;
      destroyed = true;
      stopWebGL();
      container.removeEventListener("keydown", galleryKey);
      container.replaceChildren();
    };
    const openCentered = () => { if (currentCards.length && options.onOpen) options.onOpen(currentCards[centeredIndex()]); };
    const galleryKey = event => {
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") { event.preventDefault(); moveBy(event.key === "ArrowRight" ? 1 : -1); }
      if (event.key === "Enter" && options.onOpen) { event.preventDefault(); openCentered(); }
    };
    container.addEventListener("keydown", galleryKey);
    const screenReaderList = cards => {
      const list = document.createElement("ul");
      list.className = "cic-gallery-sr-only";
      list.setAttribute("aria-label", options.srLabel || "Consented alumni stories");
      cards.forEach(card => {
        const item = document.createElement("li");
        item.textContent = `${card.label}. ${card.tag ? card.tag + ". " : ""}${card.private ? "Private. " : ""}${card.firstName || "A Coding in Color alum"}. ${card.nowDoing}. ${[card.field, card.school].filter(Boolean).join(" · ")}. Programs: ${card.programs}. ${card.story.slice(0, 110)}`;
        list.appendChild(item);
      });
      return list;
    };
    const drawCards = cards => cards.map((card, index) => {
      const canvas = document.createElement("canvas");
      canvas.width = 800; canvas.height = 600;
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Canvas is unavailable");
      ctx.fillStyle = index % 2 ? "#0A8F27" : "#000000";
      ctx.fillRect(0, 0, 800, 600);
      ctx.fillStyle = "#ffffff";
      ctx.font = "500 30px Poppins, Arial, sans-serif";
      ctx.fillText("‹ IN ›", 54, 64);
      ctx.font = "500 22px Poppins, Arial, sans-serif";
      ctx.fillText(card.firstName || "A Coding in Color alum", 54, 124, 680);
      ctx.font = "500 30px Archivo, Poppins, Arial, sans-serif";
      const headline = card.nowDoing ? card.nowDoing.charAt(0).toUpperCase() + card.nowDoing.slice(1) : "Alumni story";
      wrapCanvasText(ctx, headline, 54, 250, 690, 70, 2);
      ctx.font = "400 21px Poppins, Arial, sans-serif";
      const firstProgram = card.programs.split(",")[0].trim();
      if (firstProgram) ctx.fillText(firstProgram, 54, 380, 690);
      ctx.font = "300 22px Poppins, Arial, sans-serif";
      wrapCanvasText(ctx, excerpt(card.story, 60), 54, 455, 690, 32, 2);
      if (card.tag || card.private) {
        ctx.font = "500 20px Poppins, Arial, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`${card.private ? "🔒 Private  " : ""}${card.tag || ""}`, 746, 64, 500);
      }
      return { ...card, canvas, image: canvas.toDataURL("image/png"), artAlt: `${card.firstName || "A Coding in Color alum"}: ${headline}. ${[card.field, card.school].filter(Boolean).join(", ") || "Coding in Color alum"}. ${card.programs}. ${excerpt(card.story)}` };
    });
    const renderStatic = cards => {
      if (destroyed) return;
      stopWebGL();
      container.classList.add("cic-wall-static");
      container.setAttribute("aria-label", options.srLabel || "Consented alumni stories");
      const row = document.createElement("div"); row.className = "cic-wall-row";
      cards.forEach(card => {
        const figure = document.createElement("figure"); figure.className = "cic-wall-figure";
        const image = document.createElement("img"); image.src = card.image; image.alt = card.artAlt;
        const caption = document.createElement("figcaption"); caption.textContent = card.label;
        figure.append(image, caption); row.appendChild(figure);
      });
      container.replaceChildren(row, screenReaderList(cards));
      const step = Math.min(container.clientWidth * 0.25, 210) + 14;
      moveBy = direction => { row.scrollBy({ left: direction * step, behavior: "smooth" }); };
      centeredIndex = () => {
        const figures = [...row.querySelectorAll("figure")];
        if (!figures.length) return 0;
        const center = row.scrollLeft + row.clientWidth / 2;
        return figures.reduce((best, figure, index) => {
          const distance = Math.abs(figure.offsetLeft + figure.offsetWidth / 2 - center);
          return distance < best.distance ? { index, distance } : best;
        }, { index: 0, distance: Infinity }).index;
      };
    };
    const renderEmpty = () => {
      if (destroyed) return;
      const message = document.createElement("p");
      message.className = "cic-wall-empty";
      message.textContent = options.emptyMessage || "No consented alumni stories yet. Share the student page link to collect some. ";
      if (!options.emptyMessage) { const link = document.createElement("a"); link.href = "/"; link.textContent = "Student share page"; message.appendChild(link); }
      container.replaceChildren(message);
    };
    const startWebGL = async (cards, ogl) => {
      const { Renderer, Camera, Transform, Plane, Program, Mesh, Texture, Vec2 } = ogl;
      if (typeof ResizeObserver === "undefined") throw new Error("ResizeObserver is unavailable");
      const images = await Promise.all(cards.map(card => new Promise((resolve, reject) => {
        const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = card.image;
      })));
      if (destroyed) return;
      const height = Math.max(1, container.clientHeight);
      renderer = new Renderer({ alpha: true, antialias: true, dpr: Math.min(window.devicePixelRatio || 1, 2) });
      const gl = renderer.gl;
      activeCanvas = gl.canvas;
      activeCanvas.setAttribute("aria-hidden", "true");
      activeCanvas.style.cssText = "display:block;position:absolute;inset:0;width:100%;height:100%;";
      const srList = screenReaderList(cards);
      container.replaceChildren(activeCanvas, srList);
      const camera = new Camera(gl, { fov: 45, near: 0.1, far: 100 });
      camera.position.z = 20;
      const scene = new Transform();
      const geometry = new Plane(gl, { widthSegments: 20, heightSegments: 10 });
      const vertex = `precision highp float; attribute vec3 position; attribute vec2 uv; uniform mat4 modelViewMatrix; uniform mat4 projectionMatrix; uniform float uTime; uniform float uSpeed; varying vec2 vUv; void main(){vUv=uv;vec3 p=position;p.z=(sin(p.x*4.0+uTime)*1.5+cos(p.y*2.0+uTime)*1.5)*(0.1+uSpeed*0.5);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`;
      const fragment = `precision highp float; uniform vec2 uImageSizes; uniform vec2 uPlaneSizes; uniform sampler2D tMap; uniform float uBorderRadius; varying vec2 vUv; float roundedBoxSDF(vec2 p,vec2 b,float r){vec2 d=abs(p)-b;return length(max(d,vec2(0.0)))+min(max(d.x,d.y),0.0)-r;} void main(){vec2 ratio=vec2(min((uPlaneSizes.x/uPlaneSizes.y)/(uImageSizes.x/uImageSizes.y),1.0),min((uPlaneSizes.y/uPlaneSizes.x)/(uImageSizes.y/uImageSizes.x),1.0));vec2 uv=vec2(vUv.x*ratio.x+(1.0-ratio.x)*0.5,vUv.y*ratio.y+(1.0-ratio.y)*0.5);vec4 color=texture2D(tMap,uv);float d=roundedBoxSDF(vUv-0.5,vec2(0.5-uBorderRadius),uBorderRadius);float alpha=1.0-smoothstep(-0.002,0.002,d);gl_FragColor=vec4(color.rgb,alpha);}`;
      const titleFragment = `precision highp float; uniform sampler2D tMap; varying vec2 vUv; void main(){vec4 color=texture2D(tMap,vUv);if(color.a<0.1)discard;gl_FragColor=color;}`;
      const unit = (2 * camera.position.z * Math.tan(Math.PI / 8)) / height;
      const cardHeight = height * 0.36, cardWidth = cardHeight * 4 / 3, titleHeight = 34, spacing = cardWidth + height * 0.025;
      const radius = (height * height + options.bend * options.bend) / (2 * options.bend);

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = [];
  let line = "";
  words.forEach(word => {
    const next = line ? line + " " + word : word;
    if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
    else line = next;
  });
  if (line) lines.push(line);
  lines.slice(0, maxLines).forEach((value, index) => {
    if (index === maxLines - 1 && lines.length > maxLines) value = value.slice(0, Math.max(0, value.length - 1)) + "…";
    ctx.fillText(value, x, y + index * lineHeight, maxWidth);
  });
}
function excerpt(text, limit = 110) {
  const value = String(text || "").replace(/\s+/g, " ").trim();
  return value.length > limit ? value.slice(0, limit - 1).trimEnd() + "…" : value;
}

const NL = {
  async postJSON(path, body) {
    const r = await apiFetch(CONFIG.apiBase + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));

  bytesToB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); },
  // Shrink an image to max 1024px JPEG so it uploads fast
  async imageToB64(file) {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

  // Pull the audio out of a reel/video, keep the first 2 minutes, convert to 16 kHz mono WAV for speech-to-text
  async videoToWavB64(file) {
    const buf = await file.arrayBuffer(), ctx = new AudioContext();
    const audio = await ctx.decodeAudioData(buf); ctx.close();
    const secs = Math.min(audio.duration, 120), rate = 16000;
    const off = new OfflineAudioContext(1, Math.ceil(secs * rate), rate), src = off.createBufferSource();
    src.buffer = audio; src.connect(off.destination); src.start(0, 0, secs);
    const pcm = (await off.startRendering()).getChannelData(0);
    const out = new DataView(new ArrayBuffer(44 + pcm.length * 2)), w = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
    w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, pcm.length * 2, true);

  // No-AI fallback: a simple newsletter straight from the post captions
  simple(posts, period, alumni = []) {

    const sections = posts.slice(0, hasSpotlight ? 4 : 5).map(p => ({ heading: p.title || "Update", body: (p.caption || p.imageNotes || "").slice(0, 500), link: p.link || "" }));

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const uid = () => "r_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = {
  money: v => (v === "" || v == null || isNaN(v)) ? "" : CONFIG.currency + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  number: v => (v === "" || v == null || isNaN(v)) ? "" : Number(v).toLocaleString(),
  date: v => { if (!v) return ""; const t = new Date(v + "T00:00:00"); return isNaN(t) ? v : t.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
};

function toast(msg, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toast").appendChild(t); setTimeout(() => t.remove(), 2600);
}

let staffCodePrompt = null;
function askStaffPasscode(message = "") {
  if (staffCodePrompt) return staffCodePrompt;
  staffCodePrompt = new Promise(resolve => {
    const overlay = document.createElement("div"); overlay.className = "pass-overlay";
    overlay.innerHTML = `<section class="pass-card" role="dialog" aria-modal="true" aria-labelledby="passTitle"><h2 id="passTitle">Staff portal</h2><p>Enter your staff passcode to continue.</p><form><label for="staffPass">Staff passcode</label><input id="staffPass" type="password" autocomplete="current-password" required><p class="count" aria-live="polite">${esc(message || "Ask your program lead for the staff passcode")}</p><button class="btn primary" type="submit">Unlock</button></form></section>`;
    document.body.appendChild(overlay);
    const input = $("#staffPass", overlay); input.focus();
    $("form", overlay).onsubmit = event => { event.preventDefault(); const value = input.value; overlay.remove(); staffCodePrompt = null; resolve(value); };
  });
  return staffCodePrompt;
}

async function apiFetch(url, options = {}) {
  const headers = new Headers(options.headers || {});
  let code = ""; try { code = localStorage.getItem("cic_staff_code") || ""; } catch (e) { }
  if (code) headers.set("x-staff-code", code);
  let response = await fetch(url, { ...options, headers });
  while (response.status === 401) {
    code = await askStaffPasscode(code ? "That passcode was not accepted. Try again, or ask your program lead." : "Ask your program lead for the staff passcode");
    try { localStorage.setItem("cic_staff_code", code); } catch (e) { }
    headers.set("x-staff-code", code);
    response = await fetch(url, { ...options, headers });
  }
  return response;
}

const Store = {
  mode: "local", ai: false,
  key: e => `sbs:${slug(CONFIG.appName)}:${e}`,
  async init() {
    try {                                                   // optional AI helper (Cloudflare Worker with ANTHROPIC_API_KEY secret)
      const r = await apiFetch(CONFIG.apiBase + "/api/capabilities"); if (r.ok) this.ai = !!(await r.json()).ai;
    } catch (e) { }
    if (CONFIG.storage === "local") return;
    try {
      const c = new AbortController(); const t = setTimeout(() => c.abort(), 800);
      const r = await apiFetch(CONFIG.apiBase + "/api/ping", { signal: c.signal }); clearTimeout(t);
      if (r.ok) this.mode = "api";
    } catch (e) { if (CONFIG.storage === "api") toast("Backend not reachable — using local storage", true); }
  },
  _local(e) {
    const raw = localStorage.getItem(this.key(e));
    if (raw === null) { const seeded = (CONFIG.entities[e].seed || []).map(r => ({ id: uid(), ...r })); this._save(e, seeded); return seeded; }
    try { return JSON.parse(raw); } catch (x) { return []; }
  },

/* ---------- Theme ---------- */

const THEMES = ["ocean", "forest", "sunset", "midnight", "mono"];

/* ---------- Helpers ---------- */

/* ---------- Modal ---------- */

  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };

}
function confirmBox(msg, yesLabel = "Delete") {

/* ---------- Form (add / edit) ---------- */
function openForm(entName, rec, done) {
  const ent = CONFIG.entities[entName], editing = !!rec;
  const inputFor = f => {
    const v = editing ? rec[f.key] : (f.default ?? "");
    const id = "f_" + f.key, req = f.required ? "required" : "";
    switch (f.type) {
      case "textarea": return `<textarea id="${id}" rows="3" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`;
      case "select": return `<select id="${id}">${f.required ? "" : '<option value=""></option>'}${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      case "checkbox": return `<input id="${id}" type="checkbox" ${v ? "checked" : ""}>`;
      case "number": case "money": return `<input id="${id}" type="number" step="${f.type === "money" ? "0.01" : "any"}" ${f.min != null ? `min="${f.min}"` : ""} value="${esc(v)}" ${req}>`;
      case "date": return `<input id="${id}" type="date" value="${esc(v)}" ${req}>`;
      case "email": return `<input id="${id}" type="email" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${req}>`;
      case "phone": return `<input id="${id}" type="tel" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${req}>`;
      default: return `<input id="${id}" type="text" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${req}>`;
    }
  };
  const html = `<h2>${editing ? "Edit" : "Add"} ${esc(ent.singular)}</h2><form novalidate>
    ${editable(ent).map(f => `<div class="field"><label for="f_${f.key}">${esc(f.label)}${f.required ? " *" : ""}</label>${inputFor(f)}<div class="err" id="e_${f.key}"></div></div>`).join("")}
    <div class="row"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary" type="submit">${editing ? "Save changes" : "Add"}</button></div></form>`;
  modal(html, (ov, close) => {
    const first = $("input,select,textarea", ov); first && first.focus();
    $("[data-cancel]", ov).onclick = close;
    $("form", ov).onsubmit = async ev => {
      ev.preventDefault();
      const out = {}; let ok = true;
      for (const f of editable(ent)) {
        const el = $("#f_" + f.key, ov); let v = f.type === "checkbox" ? el.checked : el.value.trim();
        const err = $("#e_" + f.key, ov); err.textContent = "";
        if (f.required && (v === "" || v === false) && f.type !== "checkbox") { err.textContent = "Required"; ok = false; continue; }
        if ((f.type === "number" || f.type === "money") && v !== "") {
          v = Number(v); if (isNaN(v)) { err.textContent = "Enter a number"; ok = false; continue; }
          if (f.min != null && v < f.min) { err.textContent = "Must be at least " + f.min; ok = false; continue; }
        }
        if (f.type === "email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { err.textContent = "Enter a valid email"; ok = false; continue; }
        out[f.key] = v;
      }
      if (!ok) return;
      try {
        if (editing) await Store.update(entName, rec.id, out); else await Store.create(entName, out);
        close(); toast(editing ? "Saved" : "Added"); done && done();
      } catch (e) { toast(e.message, true); }
    };
  });
}

/* ---------- CSV ---------- */
function toCSV(ent, rows) {
  const q = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [ent.fields.map(f => q(f.label)).join(",")].concat(rows.map(r => ent.fields.map(f => q(plainValue(f, val(f, r)))).join(","))).join("\r\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function download(name, text, mime = "text/csv") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function pickFile(accept) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.onchange = () => { const f = i.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(f); }; i.click(); });
}
async function importCSV(entName, done) {
  const ent = CONFIG.entities[entName]; const text = await pickFile(".csv,text/csv"); if (text == null) return;
  const rows = parseCSV(text); if (rows.length < 2) return toast("That CSV has no data rows", true);
  const head = rows[0].map(h => h.trim().toLowerCase());
  const idx = editable(ent).map(f => { let i = head.indexOf(f.label.toLowerCase()); if (i < 0) i = head.indexOf(f.key.toLowerCase()); return i; });
  if (idx.every(i => i < 0)) return toast("No matching column headers found", true);
  let added = 0, skipped = 0;
  for (const r of rows.slice(1)) {
    const rec = {}; let valid = true;
    editable(ent).forEach((f, k) => {
      let v = idx[k] >= 0 ? (r[idx[k]] ?? "").trim() : (f.default ?? "");
      if ((f.type === "number" || f.type === "money") && v !== "") { v = Number(String(v).replace(/[$,]/g, "")); if (isNaN(v)) valid = false; }
      if (f.type === "checkbox") v = /^(true|yes|1|✓)$/i.test(String(v));
      if (f.required && (v === "" || v == null)) valid = false;
      rec[f.key] = v;
    });
    if (!valid) { skipped++; continue; }
    try { await Store.create(entName, rec); added++; } catch (e) { skipped++; }
  }
  toast(`Imported ${added} row${added === 1 ? "" : "s"}` + (skipped ? `, skipped ${skipped}` : ""), skipped && !added); done && done();
}

/* ---------- Charts (plain canvas) ---------- */
function groupData(ent, rows, c) {
  const gf = fieldOf(ent, c.groupBy), vf = c.value ? fieldOf(ent, c.value) : null;
  const gv = r => gf ? val(gf, r) : r[c.groupBy], vv = r => vf ? val(vf, r) : r[c.value];
  const m = new Map();
  rows.forEach(r => {
    const g = gv(r), groups = c.splitComma ? String(g || "").split(",").map(x => x.trim()).filter(Boolean) : [g];
    groups.forEach(value => { const k = value === "" || value == null ? "(none)" : String(value); m.set(k, (m.get(k) || 0) + (c.value ? Number(vv(r)) || 0 : 1)); });
  });

}
function drawChart(cv, entries, c) {

  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const pal = palette(), text = cssVar("--text"), muted = cssVar("--muted"), border = cssVar("--border");
  const vf = v => c.format === "money" ? fmt.money(v) : fmt.number(Math.round(v * 100) / 100);
  g.font = "12px " + cssVar("--font");
  if (!entries.length) { g.fillStyle = muted; g.textAlign = "center"; g.fillText("No data yet", W / 2, H / 2); return; }
  if (c.type === "doughnut") {
    const total = entries.reduce((a, e) => a + e[1], 0) || 1, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 8; let a0 = -Math.PI / 2;
    entries.forEach((e, i) => { const a1 = a0 + e[1] / total * Math.PI * 2; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a1); g.closePath(); g.fillStyle = pal[i % 6]; g.fill(); a0 = a1; });

    g.fillStyle = text; g.textAlign = "center"; g.font = "700 22px " + cssVar("--font"); g.fillText(vf(total), cx, cy + 6);

  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(W - Rr, y); g.stroke(); g.fillText(vf(max * i / 4), L - 6, y + 4); }

    entries.forEach((e, i) => { const x = L + step * (i + .5), y = T + ph - ph * e[1] / max; g.fillStyle = pal[0]; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.fillStyle = muted; g.fillText(label(e[0]), x, H - 14); });
  } else {
    entries.forEach((e, i) => {
      const bw = Math.min(54, step * .62), x = L + step * (i + .5) - bw / 2, h = ph * e[1] / max, y = T + ph - h;
      g.fillStyle = pal[i % 6]; g.beginPath(); (g.roundRect ? g.roundRect(x, y, bw, h, 6) : g.rect(x, y, bw, h)); g.fill();

    });
  }
}

/* ---------- Summary cards ---------- */
function computeStat(s, rows) {
  const whereOK = r => !s.where || Object.entries(s.where).every(([k, vals]) => [].concat(vals).includes(r[k]));
  const f = rows.filter(whereOK); const nums = () => f.map(r => Number(r[s.field])).filter(n => !isNaN(n));
  switch (s.fn) {
    case "count": return f.length;
    case "countIf": return rows.filter(s.test).length;
    case "sum": return nums().reduce((a, b) => a + b, 0);
    case "avg": { const n = nums(); return n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0; }
    case "max": return Math.max(0, ...nums());
    case "custom": return s.compute(rows);       // compute: rows => number
    default: return 0;
  }
}

function attentionHTML(data) {
  const bad = [], warn = [];
  for (const [name, ent] of Object.entries(CONFIG.entities)) {
    if (typeof ent.rowClass !== "function") continue;
    for (const rec of data[name] || []) {
      let kind = "";
      try { kind = ent.rowClass(rec); } catch (_) { continue; }
      if (kind === "flag-bad") bad.push({ name, ent, rec, kind: "bad" });
      else if (kind === "flag-warn") warn.push({ name, ent, rec, kind: "warn" });
    }
  }
  const items = bad.concat(warn), total = items.length;
  if (!total) return "";
  const rows = items.slice(0, 8).map(({ name, ent, rec, kind }) => {
    const title = rec[ent.titleField] || ent.titleFallback || "(untitled)";
    let reason = "";
    if (typeof ent.attentionReason === "function") {
      try { const value = ent.attentionReason(rec); if (typeof value === "string" && value) reason = `<span class="att-why">${esc(value)}</span>`; } catch (_) {}
    }
    return `<li class="att-${kind}"><a href="#/${esc(name)}">${esc(ent.icon || "")} <b>${esc(title)}</b> <span class="att-ent">${esc(ent.singular || "")}</span></a>${reason}</li>`;
  }).join("");
  const more = total > 8 ? `<div class="att-more">+${total - 8} more</div>` : "";
  return `<div class="card attention"><h3>Needs attention <span class="att-count">${esc(total)}</span></h3><ul class="att-list">${rows}</ul>${more}</div>`;
}

    const cols = ent.fields.filter(f => !f.hideInTable);
    if (!rows.length) { $("#tbl").innerHTML = `<div class="empty">${all.length ? "No matches" : `No ${esc(ent.label.toLowerCase())} yet — click “Add ${esc(ent.singular)}”.`}</div>`; return; }
    $("#tbl").innerHTML = `<table><thead><tr>${cols.map(f => `<th data-k="${esc(f.key)}" class="${isNum(f) ? "num" : ""}">${esc(f.label)}${st.sort === f.key ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}<th class="noclick noprint"></th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${esc(ent.rowClass ? ent.rowClass(r) : "")}">${cols.map(f => `<td class="${isNum(f) ? "num" : ""} ${f.type === "textarea" ? "wrap" : ""}">${cellHTML(f, f.key === ent.titleField ? (val(f, r) || ent.titleFallback) : val(f, r))}</td>`).join("")}
        <td class="noprint" style="text-align:right">${(Store.ai && ent.aiActions || []).map(a => `<button class="btn small" data-ai="${esc(a.id)}" data-rid="${esc(r.id)}">${esc(a.label)}</button>`).join(" ")} <button class="btn small" data-edit="${esc(r.id)}">Edit</button> <button class="btn small danger" data-del="${esc(r.id)}">Delete</button></td></tr>`).join("")}</tbody></table>`;
    $("#tbl").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; st.dir = st.sort === k ? -st.dir : 1; st.sort = k; render(); });
    $("#tbl").querySelectorAll("[data-ai]").forEach(b => b.onclick = () => runAI(name, b.dataset.ai, all.find(r => r.id === b.dataset.rid)));
    $("#tbl").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(name, all.find(r => r.id === b.dataset.edit), render));
    $("#tbl").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const rec = all.find(r => r.id === b.dataset.del);
      if (await confirmBox(`Delete “${rec[ent.titleField] || ent.titleFallback || "this record"}”? This can't be undone.`)) { try { await Store.remove(name, rec.id); toast("Deleted"); render(); } catch (e) { toast(e.message, true); } }
    });
  };
  $("#q").oninput = e => { st.q = e.target.value; render(); };
  if (filterField) $("#flt").onchange = e => { st.filter = e.target.value; render(); };
  $("#add").onclick = () => openForm(name, null, render);
  $("#imp").onclick = () => importCSV(name, render);
  $("#exp").onclick = async () => download(`${slug(ent.label)}-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(ent, await Store.list(name)));
  $("#prt").onclick = () => window.print();
  render();
  if (CONFIG.entityViewHook) CONFIG.entityViewHook(name, main, api);
}

async function viewSettings() {
  main.innerHTML = `<h1>⚙️ Settings</h1><p class="sub">Appearance, data and backup</p>
    <div class="grid" style="max-width:640px">
      <div class="card"><h3>Theme</h3><select id="theme">${THEMES.map(t => `<option ${document.documentElement.dataset.theme === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="card"><h3>Staff access</h3><p class="count">Lock this browser by clearing the saved staff passcode.</p><button class="btn" id="lock">Lock</button></div>
      <div class="card"><h3>Data</h3><p>Storage: <span class="pill">${Store.mode === "api" ? "Backend (database)" : "This browser (localStorage)"}</span></p>
        <div class="toolbar"><button class="btn" id="bk">Download backup (JSON)</button><button class="btn" id="rs">Restore backup</button>
        <button class="btn danger" id="rd">Reset demo data</button><button class="btn danger" id="cl">Clear everything</button></div></div>
    </div>`;
  $("#theme").onchange = e => { applyTheme(e.target.value); };
  $("#lock").onclick = () => { try { localStorage.removeItem("cic_staff_code"); } catch (e) { } toast("Staff portal locked in this browser"); };
  $("#bk").onclick = async () => download(`${slug(CONFIG.appName)}-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(await Store.exportAll(), null, 2), "application/json");
  $("#rs").onclick = async () => { const t = await pickFile(".json,application/json"); if (t == null) return; try { await Store.replaceAll(JSON.parse(t)); toast("Backup restored"); } catch (e) { toast("Invalid backup file", true); } };
  $("#rd").onclick = async () => { if (await confirmBox("Replace ALL data with the demo data?", "Reset")) { await Store.replaceAll(Store.seedData()); toast("Demo data restored"); } };
  $("#cl").onclick = async () => { if (await confirmBox("Delete ALL records in every table?", "Delete all")) { await Store.replaceAll({}); toast("All data cleared"); } };
}

/* ---------- Router ---------- */
function buildNav() {
  const entityNames = CONFIG.navEntities || Object.keys(CONFIG.entities);
  const available = [{ id: "dashboard", label: "Dashboard", icon: "📊" }]
    .concat((CONFIG.extraViews || []).map(v => ({ id: "x/" + v.id, label: v.label, icon: v.icon || "•" })))
    .concat(entityNames.filter(k => CONFIG.entities[k]).map(k => ({ id: k, label: CONFIG.entities[k].label, icon: CONFIG.entities[k].icon || "•" })));
  const byId = new Map(available.map(item => [item.id, item]));
  const items = CONFIG.navOrder ? CONFIG.navOrder.map(id => byId.get(id)).filter(Boolean) : available;
  $("#nav").innerHTML = items.map(i => `<a href="#/${i.id}" data-id="${i.id}"><span>${i.icon}</span>${esc(i.label)}</a>`).join("") + `<div class="sep"></div><a href="#/settings" data-id="settings"><span>⚙️</span>Settings</a><a href="/" target="_blank" rel="noopener"><span>🎓</span>Student share page</a>`;
}
async function route() {
  if (window._cleanup) { try { window._cleanup(); } catch (e) {} window._cleanup = null; }
  const id = (location.hash.replace(/^#\//, "") || "dashboard");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  window._redraw = null;
  try {
    if (id === "dashboard") await viewDashboard();
    else if (id === "settings") await viewSettings();
    else if (id.startsWith("x/")) { const v = CONFIG.extraViews.find(v => "x/" + v.id === id); main.innerHTML = ""; v ? await v.render(main, api) : (main.innerHTML = "<p>Not found</p>"); }
    else if (CONFIG.entities[id]) await viewEntity(id);
    else main.innerHTML = '<div class="empty">Page not found</div>';
  } catch (e) { main.innerHTML = `<div class="card"><b>Something went wrong.</b><br>${esc(e.message)}</div>`; console.error(e); }
}

/* ===================== BOOT (initialize storage, seed demo rows, then route) ===================== */
(async function boot() {
  $("#appName").textContent = CONFIG.appName; $("#tagline").textContent = CONFIG.tagline; $("#logo").textContent = CONFIG.logo || "";
  document.title = CONFIG.appName;
  let t = CONFIG.theme; try { t = localStorage.getItem("sbs:theme") || t; } catch (e) { }
  applyTheme(THEMES.includes(t) ? t : "ocean");
  await Store.init();
  if (Store.mode === "api") {                 // first run against an empty database → load demo data once
    const flag = "sbs:" + slug(CONFIG.appName) + ":seeded";
    let done = false; try { done = localStorage.getItem(flag) === "1"; } catch (e) { }
    if (!done) {
      const lists = await Promise.all(Object.keys(CONFIG.entities).map(n => Store.list(n)));
      if (lists.every(a => a.length === 0)) await Store.replaceAll(Store.seedData());
      try { localStorage.setItem(flag, "1"); } catch (e) { }
    }
  }
  buildNav(); window.addEventListener("hashchange", route);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => window._redraw && window._redraw(), 150); });
  route();
})();
</script>
